name: Amrutam Telemedicine CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Code Quality, Security & Concurrency Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amrutam_test_db
          POSTGRES_USER: amrutam_test_user
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=critical || true

      - name: Run Unit Tests
        env:
          NODE_ENV: test
        run: npm run test:unit

      - name: Run Concurrency & Race Condition Tests
        env:
          NODE_ENV: test
        run: npm run test:concurrency

      - name: Run Integration Tests
        env:
          NODE_ENV: test
        run: npm run test:integration

      - name: Build Docker Image
        run: |
          docker build -t amrutam-backend:ci -f docker/Dockerfile .
